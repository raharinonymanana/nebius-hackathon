name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The workflow token only needs to read the repo.
permissions:
  contents: read

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    env:
      NEBIUS_API_KEY: dummy   # offline suites never call the API; some modules read the var at import
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Offline test suites
        run: |
          python -m tests.advisory_verify
          python -m tests.locate_verify
          python -m tests.advisory_tool_verify
          python -m tests.app_router_verify
          python -m tests.sqlite_harden_verify
          python -m tests.fuzz_input_verify

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Unit tests (Vitest)
        run: npm run test
      - name: Type-check and build
        run: npm run build
